<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1721">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="南浊工作台">
<link rel="apple-touch-icon" href="apple-icon.png">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="icon.png" type="image/png" sizes="128x128">
<link rel="manifest" href="manifest.json">
<title>南浊 · 个人工作台</title>
<style>
/* 禁双击放大（保留捏合缩放与滚动） */
*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  :root {
    --bg: #1a1721;
    --bg-2: #221e2c;
    --card: rgba(255,255,255,0.04);
    --card-solid: #252130;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #e8e4ec;
    --text-mid: #a8a0b8;
    --text-dim: #6e6878;
    --accent: #8b7ec8;
    --accent-light: #a894e0;
    --accent-glow: rgba(139,126,200,0.15);
    --green: #6cbf84;
    --orange: #d4a574;
    --red: #d47474;
    --blue: #7494d4;
    --radius: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 calc(90px + env(safe-area-inset-bottom)) 0;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  /* ===== Header ===== */
  header {
    background: linear-gradient(180deg, #2a2438 0%, #1a1721 100%);
    padding: 40px 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .main-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .rule-bar { display: none; }
  /* ===== Motto ===== */
  .motto-card {
    text-align: center;
    padding: 28px 20px;
    background: linear-gradient(135deg, var(--card) 0%, var(--bg) 100%);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .motto-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--green));
  }
  .motto-main {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    line-height: 1.6;
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .motto-sub {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }
  /* ===== Container ===== */
  .container { max-width: 500px; margin: 0 auto; padding: 16px; }
  .container > section { margin-bottom: 20px; }
  /* ===== Card ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* ===== Buttons ===== */
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
  }
  .btn-outline:active { background: var(--card); }
  .btn-green { background: var(--green); }
  .btn-orange { background: var(--orange); }
  .btn-red { background: var(--red); }
  .btn-sm { padding: 6px 14px; font-size: 13px; min-height: 36px; border-radius: 8px; }
  /* ===== Module 1: Check-in ===== */
  .checkin-area { text-align: center; padding: 10px 0; }
  .today-date { font-size: 15px; color: var(--text-mid); margin-bottom: 2px; }
  .big-clock {
    font-size: 56px; font-weight: 800; text-align: center;
    color: var(--accent-light); font-variant-numeric: tabular-nums;
    letter-spacing: 4px; margin: 6px 0 14px;
    text-shadow: 0 0 30px rgba(139,126,200,0.15);
  }
  .checkin-btn {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    background: var(--accent-glow);
    color: var(--accent-light);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
  }
  .checkin-btn:active { transform: scale(0.9); }
  .checkin-btn.done {
    border-color: var(--green);
    background: rgba(108,191,132,0.15);
    color: var(--green);
  }
  .checkin-count { font-size: 14px; color: var(--text-mid); }
  .checkin-count b { font-size: 24px; color: var(--accent-light); }
  .streak-row { display: flex; justify-content: center; gap: 24px; margin-top: 10px; }
  .streak-item { text-align: center; }
  .streak-item .label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
  .streak-item .value { font-size: 22px; font-weight: 800; }
  .streak-item .value.cur { color: var(--accent-light); }
  .streak-item .value.max { color: var(--orange); }
  /* ===== Module 2: Timer ===== */
  .timer-display {
    font-size: 48px;
    font-weight: 800;
    text-align: center;
    color: var(--accent-light);
    font-variant-numeric: tabular-nums;
    margin: 10px 0;
    letter-spacing: 3px;
  }
  .timer-display.running { color: var(--green); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
  .timer-btns { display: flex; gap: 10px; justify-content: center; }
  .timer-adjust { display: flex; gap: 5px; justify-content: center; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .ta-btn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .ta-btn:active { transform: scale(0.94); }
  .ta-pending { text-align: center; margin-top: 6px; font-size: 13px; color: var(--orange); font-weight: 600; min-height: 18px; }
  /* ===== Module 3 & 4: Checklist ===== */
  .task-group-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-light);
    margin: 14px 0 6px 2px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .task-group-label:first-child { margin-top: 0; }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    min-height: 44px;
    transition: all .2s;
  }
  .checklist-item:active { transform: scale(0.98); }
  .checklist-item .checkbox {
    width: 24px; height: 24px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .2s;
    font-size: 14px;
  }
  .checklist-item .checkbox.checked {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .checklist-item .item-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.5;
  }
  .checklist-item.done .item-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .checklist-item .item-time {
    font-size: 12px;
    color: var(--accent-light);
    font-weight: 600;
    flex-shrink: 0;
  }
  .checklist-item .item-count {
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.06);
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    min-width: 28px;
    text-align: center;
  }
  .checklist-item.done .item-count {
    color: var(--green);
    background: rgba(74,222,128,0.12);
  }
  /* Math progress bar */
  .math-progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    margin-top: 4px;
    overflow: hidden;
  }
  .math-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #a78bfa, #fbbf24);
    border-radius: 4px;
    transition: width .4s ease;
  }
  .math-progress-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    display: flex;
    justify-content: space-between;
  }
  .sub-item { margin-left: 20px; }
  .section-label {
    font-size: 13px;
    color: var(--text-mid);
    margin: 10px 0 4px;
    font-weight: 600;
  }
  /* ===== Module 5: Review ===== */
  .review-textarea {
    width: 100%;
    min-height: 120px;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
  }
  .review-textarea:focus { outline: none; border-color: var(--accent); }
  /* ===== Module 6: Memo ===== */
  .memo-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .memo-input-row input {
    flex: 1;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    min-height: 44px;
  }
  .memo-input-row input:focus { outline: none; border-color: var(--accent); }
  .memo-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .memo-item .memo-text { flex: 1; font-size: 14px; line-height: 1.5; }
  .memo-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .memo-actions .icon-btn {
    width: 36px; height: 36px;
    border: none;
    border-radius: 8px;
    background: var(--card-solid);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .memo-actions .icon-btn:active { transform: scale(0.9); }
  .memo-actions .del { color: var(--red); }

/* ===== 转盘 ===== */
.wheel-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.wheel-tabs .wtab {
  flex: 1; text-align: center; padding: 8px 4px; font-size: 13px; font-weight: 600;
  border-radius: 8px; cursor: pointer; color: var(--text-dim);
  background: rgba(255,255,255,.04); border: 1px solid transparent; transition: all .2s;
  -webkit-tap-highlight-color: transparent;
}
.wheel-tabs .wtab.active { color: var(--accent-light); background: var(--accent-glow); border-color: var(--accent); }
.wheel-box { position: relative; display: flex; flex-direction: column; align-items: center; }
#wheelCanvas { max-width: 100%; }
.wheel-pointer {
  position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
  font-size: 22px; color: var(--red); z-index: 2; text-shadow: 0 1px 4px rgba(0,0,0,.5);
}
.wheel-result {
  margin-top: 12px; font-size: 17px; font-weight: 800; color: var(--accent-light);
  min-height: 26px; text-align: center;
}
.wheel-result.big { animation: wheelPop .4s ease; }
@keyframes wheelPop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  /* ===== Module 7: Coding Roadmap ===== */
  .roadmap-overview {
    text-align: center;
    margin-bottom: 16px;
    padding: 14px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .roadmap-overview .ov-label { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .roadmap-overview .ov-value { font-size: 28px; font-weight: 800; color: var(--accent-light); }
  .roadmap-overview .ov-bar {
    width: 100%; height: 10px; background: rgba(255,255,255,0.06);
    border-radius: 5px; margin-top: 8px; overflow: hidden;
  }
  .roadmap-overview .ov-fill {
    height: 100%; background: linear-gradient(90deg, #8b7ec8, #6cbf84);
    border-radius: 5px; transition: width .5s ease;
  }
  .roadmap-phase {
    position: relative;
    margin-bottom: 0;
    padding-left: 36px;
  }
  .roadmap-phase::before {
    content: '';
    position: absolute;
    left: 15px; top: 0; bottom: -16px;
    width: 2px;
    background: var(--border);
  }
  .roadmap-phase:last-child::before { display: none; }
  .roadmap-phase .phase-badge {
    position: absolute;
    left: 0; top: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    box-shadow: 0 0 0 4px var(--bg);
  }
  .roadmap-phase.done .phase-badge { background: var(--green); }
  .roadmap-phase .phase-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
    margin-left: 8px;
  }
  .roadmap-phase .phase-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-light);
    margin-bottom: 2px;
  }
  .roadmap-phase .phase-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .roadmap-topic {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    transition: all .2s;
  }
  .roadmap-topic:active { transform: scale(0.98); }
  .roadmap-topic .topic-check {
    width: 22px; height: 22px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 12px;
    transition: all .2s;
  }
  .roadmap-topic.done .topic-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .roadmap-topic .topic-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.4;
  }
  .roadmap-topic.done .topic-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .roadmap-topic .topic-meta {
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  /* ===== Stats Modal ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-2);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    animation: slideUp .3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; min-width:44px; min-height:44px; }
  .tab-row { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab-row .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-dim);
    border: 1px solid transparent;
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .tab-row .tab.active { background: var(--accent-glow); color: var(--accent-light); border-color: var(--accent); }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .stat-row b { color: var(--accent-light); }
  .stat-chart { margin: 12px 0; }
  .stat-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .stat-bar .bar-bg { flex:1; height: 16px; background: var(--card-solid); border-radius: 8px; overflow: hidden; }
  .stat-bar .bar-fill { height: 100%; background: var(--accent); border-radius: 8px; transition: width .5s; }
  .stat-bar .bar-label { width: 50px; color: var(--text-dim); }
  .stat-bar .bar-value { width: 50px; text-align: right; color: var(--text); }
  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: var(--card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 12px 24px;
    color: var(--text);
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .toast.show { opacity: 1; bottom: 50px; }
  .toast.success { border-color: var(--green); }
  .toast.warn { border-color: var(--orange); }
  /* ===== Confirm Modal ===== */
  .confirm-modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: var(--card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 24px;
    z-index: 1500;
    text-align: center;
    max-width: 300px;
  }
  .modal-overlay:not(.show) .confirm-modal { display: none; }
  .confirm-modal .confirm-text { margin-bottom: 20px; font-size: 15px; }
  .confirm-modal .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  /* ===== Result Modal ===== */
  .result-modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: var(--card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 30px;
    z-index: 1500;
    display: none;
    text-align: center;
    max-width: 280px;
  }
  .result-modal.show { display: block; animation: pop .3s ease; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0.5); } 100% { transform: translate(-50%,-50%) scale(1); } }
  .result-modal .result-emoji { font-size: 48px; margin-bottom: 8px; }
  .result-modal .result-text { font-size: 20px; font-weight: 700; color: var(--accent-light); margin-bottom: 16px; }
  /* ===== Empty state ===== */
  .empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 20px; }
  /* ===== Hidden ===== */
  .hidden { display: none !important; }

  /* Tabs */
  .tabs {
    display: flex; gap: 2px; padding: 6px 8px;
    flex-wrap: nowrap; background: var(--bg-2);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .tab {
    flex: 1; padding: 10px 0; cursor: pointer;
    color: var(--text-dim); font-size: 14px; font-weight: 500;
    border: none; border-radius: 10px; transition: all .25s;
    text-align: center; background: transparent;
  }
  .tab.active { background: var(--accent-glow); color: var(--accent-light); font-weight: 700; }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 底部语音速记栏 ===== */
.voice-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 150;
  display: none; gap: 8px; align-items: center;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--bg-2); border-top: 1px solid var(--border);
}
.voice-bar input { flex: 1; }
#voice-btn {
  font-size: 20px; line-height: 1; padding: 9px 14px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
#voice-btn.listening { background: var(--red); animation: voicePulse 1.2s ease-in-out infinite; }
@keyframes voicePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,75,75,.55); }
  50% { box-shadow: 0 0 0 9px rgba(255,75,75,0); }
}

<script>
// ====== Storage ======
const DB = {
  get(key, def) {
    try { const v = localStorage.getItem('wb_' + key); return v ? JSON.parse(v) : def; }
    catch { return def; }
  },
  set(key, val) { localStorage.setItem('wb_' + key, JSON.stringify(val)); }
};

// ====== Toast ======
let toastTimer;
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ====== Confirm ======
let confirmCallback = null;
function showConfirm(msg, callback) {
  document.getElementById('confirm-text').textContent = msg;
  document.getElementById('confirm-overlay').classList.add('show');
  confirmCallback = callback;
}
document.getElementById('confirm-ok-btn').onclick = () => {
  closeConfirm();
  if (confirmCallback) confirmCallback();
  confirmCallback = null;
};
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('show'); }

// ====== Date helpers ======
function today() { return new Date().toISOString().slice(0,10); }
function getDayOfWeek() { return new Date().getDay(); } // 0=Sun, 1=Mon, ..., 6=Sat
function isMonday() { return getDayOfWeek() === 1; }
function fmtTime(s) {
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtMin(s) { return Math.floor(s/60) + '分钟'; }
function fmtHour(s) { return (s/3600).toFixed(1) + '小时'; }
function fmtDual(s) { const h=(s/3600).toFixed(1),m=Math.floor(s/60); return h+'小时 · '+m+'分钟'; }

// ====== Module 1: Check-in ======
function getCheckins() { return DB.get('checkins', []); }
function toggleCheckin() {
  const t = today();
  let checkins = getCheckins();
  if (checkins.includes(t)) {
    checkins = checkins.filter(d => d !== t);
    toast('已取消打卡', '');
  } else {
    checkins.push(t);
    toast('打卡成功！✅', 'success');
    document.getElementById('checkin-btn').classList.add('done');
    document.getElementById('checkin-btn').textContent = '已打卡';
  }
  DB.set('checkins', checkins);
  updateCheckinUI();
}
function updateCheckinUI() {
  const checkins = getCheckins();
  const isToday = checkins.includes(today());
  const btn = document.getElementById('checkin-btn');
  if (isToday) { btn.classList.add('done'); btn.textContent = '已打卡'; }
  else { btn.classList.remove('done'); btn.textContent = CFG.buttons.checkin || '今日打卡'; }
  document.getElementById('checkin-total').textContent = checkins.length;
  // Calculate streaks
  const sorted = checkins.slice().sort();
  let curStreak = 0, maxStreak = 0, tmpStreak = 0;
  let prev = null;
  for (const d of sorted) {
    if (prev === null) {
      tmpStreak = 1;
    } else {
      const diff = (new Date(d) - new Date(prev)) / 86400000;
      if (diff === 1) tmpStreak++;
      else if (diff === 0) {} // same day, skip
      else tmpStreak = 1;
    }
    if (tmpStreak > maxStreak) maxStreak = tmpStreak;
    prev = d;
  }
  // Current streak: count backwards from today (or yesterday if not checked in today)
  const t = today();
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (checkins.includes(t)) {
    curStreak = tmpStreak; // if today checked in, current streak is the last run
  } else if (checkins.includes(yesterday)) {
    // find streak ending yesterday
    curStreak = 0;
    let checkDate = yesterday;
    while (checkins.includes(checkDate)) {
      curStreak++;
      checkDate = new Date(new Date(checkDate) - 86400000).toISOString().slice(0, 10);
    }
  } else {
    curStreak = 0;
  }
  document.getElementById('streak-current').textContent = curStreak;
  document.getElementById('streak-max').textContent = maxStreak;
}

// ====== Module 2: Timer ======
let timerRunning = false, timerStart = 0, timerInterval = null, todaySegments = [];
let timerAdjustSec = 0, lastShownSec = -1;

function getTodaySegments() {
  const data = DB.get('timer_segments', {});
  return data[today()] || [];
}
function saveTodaySegments(segs) {
  const data = DB.get('timer_segments', {});
  data[today()] = segs;
  DB.set('timer_segments', data);
}
function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerStart = Date.now() - timerAdjustSec * 1000; // 带上补时继续
  timerAdjustSec = 0;
  DB.set('timer_state', { running: true, start: timerStart });
  document.getElementById('timer-start').disabled = true;
  document.getElementById('timer-stop').disabled = false;
  document.getElementById('timer-display').classList.add('running');
  updateAdjustUI();
  timerInterval = setInterval(updateTimerDisplay, 100);
}
function stopTimer() {
  if (!timerRunning) return;
  timerRunning = false;
  clearInterval(timerInterval);
  DB.set('timer_state', { running: false, start: 0 });
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  if (elapsed >= 60) {
    const segs = getTodaySegments();
    segs.push({ start: timerStart, end: Date.now(), duration: elapsed });
    saveTodaySegments(segs);
    toast(`本次学习 ${fmtMin(elapsed)}，已保存✅`, 'success');
  } else {
    toast(`本次仅 ${elapsed} 秒，未满1分钟不计入记录`, 'warn');
  }
  document.getElementById('timer-start').disabled = false;
  document.getElementById('timer-stop').disabled = true;
  document.getElementById('timer-display').classList.remove('running');
  document.getElementById('timer-display').textContent = '00:00:00';
  lastShownSec = -1;
  updateAdjustUI();
  updateTimerCount();
  if (statTab === 'day') renderStats(); // 结束计时后底部统计立刻落账
}
function updateTimerDisplay() {
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  document.getElementById('timer-display').textContent = fmtTime(elapsed);
  if (elapsed !== lastShownSec) { lastShownSec = elapsed; updateTimerCount(); if (statTab === 'day') renderStats(); } // 今日统计实时同步
}
// 补时按钮：计时中直接平移起点；未计时直接把时间写入今日记录（立即落盘+统计同步）
function adjustTimer(min) {
  const delta = min * 60;
  if (timerRunning) {
    timerStart -= delta * 1000; // +10分 => 起点前移10分钟
    if (Date.now() - timerStart < 0) timerStart = Date.now();
    DB.set('timer_state', { running: true, start: timerStart });
    lastShownSec = -1;
    updateTimerDisplay();
    toast(`已${min > 0 ? '加' : '减'} ${Math.abs(min)} 分钟`, 'success');
  } else {
    timerAdjustSec = 0; // 旧版挂起的补时不再等待"开始"，直接走下面入账
    const segs = getTodaySegments();
    if (min > 0) {
      const last = segs[segs.length - 1];
      if (last && last.manual && Date.now() - last.end < 10 * 60 * 1000) {
        // 10分钟内连续补点合并成一段，避免刷出十几条1分钟碎片
        last.duration += delta;
        last.end = Date.now();
        last.start = last.end - last.duration * 1000;
      } else {
        const end = Date.now();
        segs.push({ start: end - delta * 1000, end: end, duration: delta, manual: true });
      }
      saveTodaySegments(segs);
      document.getElementById('timer-display').textContent = '00:00:00';
      lastShownSec = -1;
      updateTimerCount();  // "今日 X 段 · 共 X" 立即刷新
      renderStats();       // 底部日/周/月统计立即刷新
      toast(`已补记 ${min >= 60 ? (min / 60) + ' 小时' : min + ' 分钟'}，今日统计已更新`, 'success');
    } else {
      if (!segs.length) { toast('今日还没有记录可减', 'warn'); return; }
      const last = segs[segs.length - 1];
      last.duration = Math.max(0, last.duration + delta);
      if (last.duration < 60) { segs.pop(); toast('该段已不足1分钟，已删除', 'warn'); }
      else {
        last.end = Date.now();
        last.start = last.end - last.duration * 1000;
      }
      saveTodaySegments(segs);
      updateTimerCount();
      renderStats();
      if (last && last.duration >= 60) toast(`已减 ${Math.abs(min)} 分钟`, 'success');
    }
    updateAdjustUI();
  }
}
function updateAdjustUI() {
  const el = document.getElementById('ta-pending');
  if (!timerRunning && timerAdjustSec > 0) {
    el.textContent = `已补 ${fmtMin(timerAdjustSec)}，点开始继续`;
  } else {
    el.textContent = '';
  }
}
function updateTimerCount() {
  const segs = getTodaySegments();
  let totalSec = segs.reduce((s, x) => s + x.duration, 0);
  if (timerRunning) totalSec += Math.floor((Date.now() - timerStart) / 1000); // 进行中的时间也计入今日
  const fmt = CFG.statLabels.timer_count || '今日 {n} 段 · 共 {m}';
  document.getElementById('timer-count').textContent = fmt.replace('{n}',segs.length).replace('{m}',fmtDual(totalSec)).replace('分钟 分钟', '分钟');
  updateRecordBadge();
}
// 历史最长纪录：全期单日学习时长之最；今天刷新纪录时高亮
function fmtRec(s) { return s >= 3600 ? (s/3600).toFixed(1) + '小时' : Math.round(s/60) + '分钟'; }
function updateRecordBadge() {
  const el = document.getElementById('timer-record');
  if (!el) return;
  const data = DB.get('timer_segments', {});
  let bestDate = '', bestSec = 0;
  for (const d in data) {
    if (!Array.isArray(data[d])) continue;
    const t = data[d].reduce((a, x) => a + (x.duration || 0), 0);
    if (t > bestSec) { bestSec = t; bestDate = d; }
  }
  const segs = data[today()] || [];
  let todaySec = segs.reduce((a, x) => a + (x.duration || 0), 0);
  if (timerRunning) todaySec += Math.floor((Date.now() - timerStart) / 1000);
  if (todaySec > bestSec) { bestSec = todaySec; bestDate = today(); }
  if (bestSec < 60) { el.textContent = ''; return; }
  const parts = bestDate.split('-');
  const isToday = bestDate === today();
  el.textContent = isToday
    ? '🏆 今日 ' + fmtRec(bestSec) + ' —— 历史新高！'
    : '🏆 历史最长：' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日 · ' + fmtRec(bestSec);
  el.style.color = isToday ? '#e6a23c' : '#c07f00';
}
// 恢复被浏览器杀掉的计时：页面加载时若上次仍在计时，从落盘的时间戳续算
function restoreTimer() {
  const st = DB.get('timer_state', null);
  if (!st || !st.running || !st.start) return;
  timerRunning = true;
  timerStart = st.start;
  document.getElementById('timer-start').disabled = true;
  document.getElementById('timer-stop').disabled = false;
  document.getElementById('timer-display').classList.add('running');
  updateTimerDisplay();
  timerInterval = setInterval(updateTimerDisplay, 100);
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  if (elapsed >= 60) toast(`页面重载，计时已恢复，本次已进行 ${fmtMin(elapsed)}`, 'success');
}
// 从后台切回前台的瞬间立即校准显示，不等节流定时器
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && timerRunning) updateTimerDisplay();
});
window.addEventListener('pageshow', () => {
  if (timerRunning) updateTimerDisplay();
});

// ====== Module 4: Study Tasks ======
const defaultConfig={
  mainTitle:"南浊 · 个人工作台",
  ruleText:"天行健，君子以自强不息",
  ruleText2:"大道五十，天衍四九，人遁其一",
  timeHint:"该休息啦，辛苦一天了 ❤️",
  tabs:[{id:"home",icon:"🏠",name:"首页"},{id:"study",icon:"📋",name:"学习"},{id:"memo",icon:"⚡",name:"速记"},{id:"coding",icon:"🎡",name:"转盘"}],
  cardTitles:{checkin_stats:"📋 打卡 & 数据总览",timer:"⏱ 番茄计时器",tasks:"📚 每日学习任务",memo:"⚡ 知识库速记",stats:"📊 学习数据统计",coding:"🎡 决策转盘"},
  buttons:{checkin:"今日打卡",stats:"📊 数据统计",timer_start:"▶ 开始学习",timer_stop:"■ 结束计时",memo_add:"+ 新增"},
  statLabels:{checkin_total:"累计打卡 {n} 天",timer_count:"今日 {n} 段 · 共 {m}"},
  statTabs:{day:"日统计",week:"周统计",month:"月统计"},
  statRowLabels:{daily_total:"当日总时长",seg_count:"学习段数",seg_detail:"分段明细",no_data:"今日暂无记录",week_total:"本周总时长",daily_avg:"日均时长",checkin_days:"打卡天数",study_days:"学习天数",trend_title:"时长趋势",month_total:"月度总时长",week_trend:"周度趋势",minute_suffix:"分"},
  taskGroups:[
    {label:'考研',icon:'📖',items:[
      {cat:'英二闪背单词',time:'每日记录',desc:'',isVocab:true},
      {cat:'数学',time:'1考点/天',desc:'',isMath:true},
      {cat:'逻辑',time:'每日',desc:''},
      {cat:'写作',time:'每日',desc:''},
    ]},
    
  ],
  mathTotal:76,
  vocabTotal:427,
  configVersion:4
};
function loadConfig(){
  try{
    const v=localStorage.getItem('workbench_config');
    if(!v) return JSON.parse(JSON.stringify(defaultConfig));
    const saved=JSON.parse(v);
    // Force-refresh tabs and cardTitles when config version changes
    if(!saved.configVersion || saved.configVersion<defaultConfig.configVersion){
      saved.tabs=defaultConfig.tabs;
      saved.cardTitles=defaultConfig.cardTitles;
      saved.buttons=defaultConfig.buttons;
      saved.taskGroups=defaultConfig.taskGroups;
      saved.mathTotal=defaultConfig.mathTotal;
      saved.vocabTotal=defaultConfig.vocabTotal;
      delete saved.review;
      saved.configVersion=defaultConfig.configVersion;
      delete saved.restRuleText;
      delete saved.wheelCats;
      localStorage.setItem('workbench_config',JSON.stringify(saved));
    }
    return saved;
  }catch(e){return JSON.parse(JSON.stringify(defaultConfig))}
}
const CFG=loadConfig();
const MATH_TOTAL=CFG.mathTotal;
const VOCAB_TOTAL=CFG.vocabTotal;
const taskGroups=CFG.taskGroups;
const tasks=taskGroups.flatMap(g=>g.items.map(t=>({...t,group:g.label})));
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function applyConfig(){
  document.querySelector('.main-title').textContent=CFG.mainTitle||'';
  document.getElementById('rule-text').textContent=CFG.ruleText||'';
  const rt2=document.getElementById('rule-text-2');if(rt2)rt2.textContent=CFG.ruleText2||'';
  // Tabs

const WHEEL_DEFS = {
  travel: { name: '旅游城市', items: ['上海', '杭州', '苏州', '南京', '北京', '成都', '重庆', '长沙', '西安', '青岛', '厦门', '武汉'] },

};
let wheelKey = 'travel';
let wheelAngle = 0, spinning = false;

function getWheelItems() { return DB.get('wheel_' + wheelKey, WHEEL_DEFS[wheelKey].items); }
function setWheelItems(items) { DB.set('wheel_' + wheelKey, items); }

function switchWheel(k) {
  wheelKey = k;
  document.querySelectorAll('.wheel-tabs .wtab').forEach(t => t.classList.toggle('active', t.dataset.w === k));
  wheelAngle = 0;
  drawWheel();

  document.getElementById('wheel-result').classList.remove('big');
}

function drawWheel() {
  const cv = document.getElementById('wheelCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const items = getWheelItems();
  const n = items.length || 1;
  const cx = 170, cy = 170, R = 155;
  const colors = ['#58cc02','#1cb0f6','#ff9600','#ce82ff','#ff4b4b','#00b8a9','#f4b400','#ff6f91','#4dd0e1','#aed581','#ff8a65','#9575cd','#4fc3f7','#ffb74d'];
  ctx.clearRect(0, 0, 340, 340);
  // 外圈
  ctx.beginPath(); ctx.arc(cx, cy, R + 8, 0, Math.PI * 2);
  ctx.fillStyle = '#1a2333'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = '#0d1420'; ctx.fill();
  const arc = (Math.PI * 2) / n;
  for (let i = 0; i < n; i++) {
    const a0 = wheelAngle + i * arc, a1 = a0 + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(13,20,32,.9)'; ctx.lineWidth = 2; ctx.stroke();
    // 文字
    const mid = a0 + arc / 2;
    const tr = R * 0.62;
    ctx.save();
    ctx.translate(cx + Math.cos(mid) * tr, cy + Math.sin(mid) * tr);
    ctx.rotate(mid + Math.PI / 2);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = items[i].length > 6 ? items[i].slice(0, 5) + '…' : items[i];
    ctx.fillText(label, 0, 0);
    ctx.restore();
  }
  // 中心
  ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2);
  ctx.fillStyle = '#1a2333'; ctx.fill();
  ctx.strokeStyle = '#58cc02'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#58cc02'; ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('GO', cx, cy);
}

function spinWheel() {
  if (spinning) return;
  const items = getWheelItems();
  if (!items.length) { toast('先添加选项', ''); return; }
  spinning = true;
  const resEl = document.getElementById('wheel-result');
  resEl.textContent = '转动中…'; resEl.classList.remove('big');
  const n = items.length;
  const arc = 360 / n;
  const idx = Math.floor(Math.random() * n);
  // 指针在正上方(-90deg)，目标扇区中心对准指针
  const targetCenter = -90 - (idx * arc + arc / 2) + Math.PI * 180 / Math.PI * 0; // deg
  const targetDeg = (idx * arc + arc / 2) + 90; // 使扇区中心到达-90°(正上)
  const extra = 360 * (5 + Math.floor(Math.random() * 3));
  const finalDeg = wheelAngle * 180 / Math.PI - (wheelAngle * 180 / Math.PI % 360) + extra + (360 - targetDeg % 360);
  const startAngle = wheelAngle * 180 / Math.PI;
  const total = finalDeg + Math.ceil((startAngle - finalDeg) / 360) * 360 + 360 * 6;
  const dur = 4200;
  const t0 = performance.now();
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
  function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    const deg = startAngle + (total - startAngle) * easeOut(p);
    wheelAngle = deg * Math.PI / 180;
    drawWheel();
    if (p < 1) { requestAnimationFrame(frame); }
    else {
      spinning = false;
      // 校验落点
      const norm = ((deg % 360) + 360) % 360;
      const landed = Math.floor((((270 - norm % 360) % 360) + 360) % 360 / arc) % n;
      resEl.textContent = '🎯 ' + items[landed];
      resEl.classList.add('big');
      if (navigator.vibrate) navigator.vibrate(40);
    }
  }
  requestAnimationFrame(frame);
}

function resetWheel() {

  showConfirm('恢复这个转盘的默认选项？', () => {

}

// ====== 语音输入（速记）：按住说话，松手自动发送 ======
let recog = null, listening = false, holdActive = false, pendingSend = false;
function startVoice() {
  if (listening) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('此浏览器不支持语音识别，请用 Safari/Chrome', ''); return; }
  const btn = document.getElementById('voice-btn');
  const input = document.getElementById('memo-input');
  holdActive = true; pendingSend = false;
  recog = new SR();
  recog.lang = 'zh-CN';
  recog.interimResults = true;
  recog.continuous = true; // 不自动停：什么时候停由你的手指决定
  const baseText = input.value ? input.value : '';
  recog.onstart = () => { listening = true; btn.classList.add('listening'); toast('按住说，松手自动发送 🎤', ''); };
  recog.onresult = (e) => {
    let fin = '', inter = '';
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) fin += r[0].transcript; else inter += r[0].transcript;
    }
    input.value = baseText + fin + inter;
  };
  recog.onerror = (e) => {
    listening = false; btn.classList.remove('listening');
    toast(e.error === 'not-allowed' ? '需要麦克风权限（iOS: 设置>Safari>麦克风）' : '识别失败：' + e.error, '');
  };
  recog.onend = () => {
    listening = false; btn.classList.remove('listening');
    if (pendingSend) { pendingSend = false; const v = input.value.trim(); if (v) addMemo(); }
    else if (holdActive) { try { recog.start(); } catch (err) {} } // iOS 静音自停，手指还按着就续听
  };
  try { recog.start(); } catch (err) { toast('无法启动麦克风', ''); }
}
function stopVoice(send) {
  holdActive = false;
  if (recog && listening) { pendingSend = !!send; try { recog.stop(); } catch (e) {} }
  else if (send) { const input = document.getElementById('memo-input'); const v = input.value.trim(); if (v) addMemo(); }
}
document.addEventListener('DOMContentLoaded', function () {
  const btn = document.getElementById('voice-btn');
  if (!btn) return;
  btn.addEventListener('pointerdown', function (e) { e.preventDefault(); startVoice(); });
  btn.addEventListener('pointerup',   function (e) { e.preventDefault(); stopVoice(true); });
  btn.addEventListener('pointercancel', function () { stopVoice(false); });
  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
});

// ====== Stats ======
let statTab = 'day';
let statsWeekOffset = 0; // 0=this week, -1=last week, etc.
let statsDayOffset = 0; // 0=today, -1=yesterday, etc.
let statsMonthOffset = 0; // 0=this month, -1=last month, etc.
function switchStatTab(tab) {
  statTab = tab;
  statsWeekOffset = 0;
  statsDayOffset = 0;
  statsMonthOffset = 0;
  document.querySelectorAll('#stats-tab-row .tab').forEach((t, i) => {
    t.classList.toggle('active', ['day','week','month'][i] === tab);
  });
  renderStats();
}
function shiftStatsWeek(delta) {
  statsWeekOffset += delta;
  if (statsWeekOffset > 0) statsWeekOffset = 0;
  renderStats();
}
function shiftStatsDay(delta) {
  statsDayOffset += delta;
  if (statsDayOffset > 0) statsDayOffset = 0;
  renderStats();
}
function shiftStatsMonth(delta) {
  statsMonthOffset += delta;
  if (statsMonthOffset > 0) statsMonthOffset = 0;
  renderStats();
}
function getAllTimerData() {
  return DB.get('timer_segments', {});
}
function getStatsData(period) {
  const data = getAllTimerData();
  const now = new Date();
  let dates = [];
  if (period === 'day') {
    const d = new Date();
    d.setDate(d.getDate() + statsDayOffset);
    dates = [d.toISOString().slice(0,10)];
  } else if (period === 'week') {
    const day = now.getDay() || 7;
    const baseDate = new Date(now);
    baseDate.setDate(now.getDate() + statsWeekOffset * 7);
    const baseDay = baseDate.getDay() || 7;
    for (let i = 1; i <= 7; i++) {
      const d = new Date(baseDate);
      d.setDate(baseDate.getDate() - baseDay + i);
      dates.push(d.toISOString().slice(0,10));
    }
  } else {
    const base = new Date(now.getFullYear(), now.getMonth() + statsMonthOffset, 1);
    const y = base.getFullYear(), m = base.getMonth();
    const days = new Date(y, m + 1, 0).getDate();
    for (let i = 1; i <= days; i++) {
      dates.push(`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
    }
  }
  let result = [];
  const overrides = DB.get('manual_time', {}) || {};
  for (const d of dates) {
    const segs = data[d] || [];
    let total = segs.reduce((s, x) => s + x.duration, 0);
    // Apply manual time override if set (convert minutes to seconds)
    if (overrides[d] !== undefined) {
      total = overrides[d] * 60;
    }
    result.push({ date: d, segments: segs, total });
  }
  return result;
}
function renderStats() {
  const stats = getStatsData(statTab);
  const content = document.getElementById('stats-content');
  const totalSec = stats.reduce((s, x) => s + x.total, 0);
  const checkins = getCheckins();
  const L = CFG.statRowLabels || {};
  const minSuffix = L.minute_suffix || '分';
  
  if (statTab === 'day') {
    const todayStats = stats[0];
    const segs = todayStats.segments;
    const liveSec = (statsDayOffset === 0 && timerRunning) ? Math.floor((Date.now() - timerStart) / 1000) : 0; // 进行中的时间（只属于今天）
    // Day navigation header
    const dLabel = statsDayOffset === 0 ? '今日' : statsDayOffset === -1 ? '昨日' : `前${-statsDayOffset}天`;
    const dShort = todayStats.date.slice(5).replace('-','/');
    let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsDay(-1)" style="min-width:36px">◀</button>`;
    html += `<span style="font-size:14px;font-weight:600;color:var(--accent-light)">${dLabel} ${dShort}（周${'日一二三四五六'[new Date(todayStats.date + 'T12:00:00').getDay()]}）</span>`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsDay(1)" style="min-width:36px" ${statsDayOffset>=0?'disabled':''}>▶</button>`;
    html += `</div>`;
    html += `<div class="stat-row"><span>${L.daily_total||'当日总时长'}</span><b>${fmtDual(todayStats.total + liveSec)}</b></div>`;
    html += `<div class="stat-row"><span>${L.seg_count||'学习段数'}</span><b>${segs.length + (liveSec>0?1:0)} 段</b></div>`;
    html += `<div class="section-label" style="margin-top:12px">${L.seg_detail||'分段明细'}</div>`;
    if (segs.length) {
      html += segs.map(s => {
        const st = new Date(s.start), en = new Date(s.end);
        return `<div class="stat-row"><span>${s.manual ? '✏️ 补记 ' : ''}${st.toTimeString().slice(0,5)}-${en.toTimeString().slice(0,5)}</span><b>${fmtMin(s.duration)}</b></div>`;
      }).join('');
    }
    if (liveSec > 0) {
      const stT = new Date(timerStart).toTimeString().slice(0,5);
      html += `<div class="stat-row"><span>${stT}-当前</span><b style="color:var(--orange)">⏱ ${fmtMin(liveSec)} 进行中</b></div>`;
    }
    if (!segs.length && !liveSec) {
      html += `<div class="empty">${statsDayOffset === 0 ? (L.no_data||'今日暂无记录') : '当日暂无记录'}</div>`;
    }
    content.innerHTML = html;
  } else if (statTab === 'week') {
    const activeDays = stats.filter(s => s.total > 0).length;
    const checkinDays = stats.filter(s => checkins.includes(s.date)).length;
    // Week navigation header
    const wDates = stats.map(s => s.date);
    const wStart = wDates[0] ? wDates[0].slice(5).replace('-','/') : '';
    const wEnd = wDates[6] ? wDates[6].slice(5).replace('-','/') : '';
    const weekLabel = statsWeekOffset === 0 ? '本周' : statsWeekOffset === -1 ? '上周' : `前${-statsWeekOffset}周`;
    let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsWeek(-1)" style="min-width:36px">◀</button>`;
    html += `<span style="font-size:14px;font-weight:600;color:var(--accent-light)">${weekLabel} ${wStart} - ${wEnd}</span>`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsWeek(1)" style="min-width:36px" ${statsWeekOffset>=0?'disabled':''}>▶</button>`;
    html += `</div>`;
    html += `<div class="stat-row"><span>${L.week_total||'本周总时长'}</span><b>${fmtDual(totalSec)}</b></div>`;
    html += `<div class="stat-row"><span>${L.daily_avg||'日均时长'}</span><b>${fmtDual(totalSec / 7)}</b></div>`;
    html += `<div class="stat-row"><span>${L.checkin_days||'打卡天数'}</span><b>${checkinDays} / 7</b></div>`;
    html += `<div class="stat-row"><span>${L.study_days||'学习天数'}</span><b>${activeDays} / 7</b></div>`;
    html += `<div class="stat-chart"><div class="section-label">${L.trend_title||'时长趋势'}</div>`;
    const days = ['一','二','三','四','五','六','日'];
    const maxVal = Math.max(...stats.map(s => s.total), 1);
    html += stats.map((s, i) => {
      const pct = (s.total / maxVal * 100).toFixed(0);
      const h = (s.total/3600).toFixed(1), mins = Math.floor(s.total / 60);
      return `<div class="stat-bar"><span class="bar-label">周${days[i]}</span><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-value">${h}h · ${mins}${minSuffix}</span></div>`;
    }).join('');
    html += '</div>';
    content.innerHTML = html;
  } else {
    const activeDays = stats.filter(s => s.total > 0).length;
    const checkinDays = stats.filter(s => checkins.includes(s.date)).length;
    // Month navigation header
    const mBase = new Date();
    const mTarget = new Date(mBase.getFullYear(), mBase.getMonth() + statsMonthOffset, 1);
    const mLabel = statsMonthOffset === 0 ? '本月' : statsMonthOffset === -1 ? '上月' : `${mTarget.getFullYear()}年${mTarget.getMonth()+1}月`;
    let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsMonth(-1)" style="min-width:36px">◀</button>`;
    html += `<span style="font-size:14px;font-weight:600;color:var(--accent-light)">${mLabel} ${mTarget.getFullYear()}/${String(mTarget.getMonth()+1).padStart(2,'0')}</span>`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsMonth(1)" style="min-width:36px" ${statsMonthOffset>=0?'disabled':''}>▶</button>`;
    html += `</div>`;
    html += `<div class="stat-row"><span>${L.month_total||'月度总时长'}</span><b>${fmtDual(totalSec)}</b></div>`;
    html += `<div class="stat-row"><span>${L.checkin_days||'打卡天数'}</span><b>${checkinDays} 天</b></div>`;
    html += `<div class="stat-row"><span>${L.study_days||'学习天数'}</span><b>${activeDays} 天</b></div>`;
    // Group by fixed 7-day blocks within the month (Week 1: 1-7, Week 2: 8-14, etc.)
    const now = new Date();
    const daysInTargetMonth = new Date(mTarget.getFullYear(), mTarget.getMonth() + 1, 0).getDate();
    const monthDay = statsMonthOffset === 0 ? now.getDate() : daysInTargetMonth; // 本月显示到今天，历史月显示整月
    const weekCount = Math.ceil(monthDay / 7);
    const maxVal = Math.max(...stats.map(s => s.total), 1);
    html += `<div class="stat-chart"><div class="section-label">${L.week_trend||'周度趋势'}</div>`;
    for (let w = 0; w < weekCount; w++) {
      const start = w * 7 + 1;
      const end = Math.min((w + 1) * 7, monthDay);
      const wStats = stats.filter(s => {
        const day = parseInt(s.date.slice(8, 10));
        return day >= start && day <= end;
      });
      const val = wStats.reduce((s, x) => s + x.total, 0);
      const pct = (val / maxVal * 100).toFixed(0);
      const h = (val/3600).toFixed(1), mins = Math.floor(val / 60);
      const label = `第${w+1}周(${start}-${end})`;
      html += `<div class="stat-bar"><span class="bar-label">${label}</span><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-value">${h}h · ${mins}${minSuffix}</span></div>`;
    }
    html += '</div>';
    content.innerHTML = html;
  }
}

// ====== Smart Time Detection ======
function checkTimeHint() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const totalMin = h * 60 + m;
  // 12:00-14:00 lunch break
  if (totalMin >= 720 && totalMin < 840) {
    setTimeout(() => toast('该吃午饭啦，休息一下 🍚', 'warn'), 500);
  }
  // 22:00-8:00 night rest
  if (totalMin >= 1320 || totalMin < 480) {
    setTimeout(() => toast(CFG.timeHint||'该休息啦，辛苦一天了 ❤️', 'warn'), 500);
  }
}

// ====== Utils ======
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}


// ====== Tabs ======
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const vbar = document.getElementById('voice-bar-wrap');
  if (vbar) vbar.style.display = (name === 'memo') ? 'flex' : 'none';
  const tab = document.querySelector(`.tab[data-tab="${name}"]`);
  const panel = document.getElementById('panel-' + name);
  if (tab) tab.classList.add('active');
  if (panel) panel.classList.add('active');
  window.scrollTo(0, 0);
}

// ====== Live Clock ======
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const clockEl = document.getElementById('big-clock');
  if (clockEl) clockEl.textContent = h+':'+m+':'+s;
  const dateEl = document.getElementById('today-date');
  if (dateEl) {
    const days = ['日','一','二','三','四','五','六'];
    dateEl.textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 周'+days[now.getDay()];
  }
}
updateClock();
setInterval(updateClock, 1000);

// ====== Init ======
applyConfig();
updateCheckinUI();
updateTimerCount();
restoreTimer();
renderTasks();
renderStats();
loadReview();
renderMemos();
drawWheel();
checkTimeHint();
</script>
