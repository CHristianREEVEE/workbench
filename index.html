<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1721">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="南浊工作台">
<link rel="apple-touch-icon" href="apple-icon.png">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="icon.png" type="image/png" sizes="128x128">
<link rel="manifest" href="manifest.json">
<title>南浊 · 个人工作台</title>
<style>
  :root {
    --bg: #1a1721;
    --bg-2: #221e2c;
    --card: rgba(255,255,255,0.04);
    --card-solid: #252130;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #e8e4ec;
    --text-mid: #a8a0b8;
    --text-dim: #6e6878;
    --accent: #8b7ec8;
    --accent-light: #a894e0;
    --accent-glow: rgba(139,126,200,0.15);
    --green: #6cbf84;
    --orange: #d4a574;
    --red: #d47474;
    --blue: #7494d4;
    --radius: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px 0;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  /* ===== Header ===== */
  header {
    background: linear-gradient(180deg, #2a2438 0%, #1a1721 100%);
    padding: 40px 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .main-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .rule-bar { display: none; }
  /* ===== Motto ===== */
  .motto-card {
    text-align: center;
    padding: 28px 20px;
    background: linear-gradient(135deg, var(--card) 0%, var(--bg) 100%);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .motto-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--green));
  }
  .motto-main {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    line-height: 1.6;
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .motto-sub {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }
  /* ===== Container ===== */
  .container { max-width: 500px; margin: 0 auto; padding: 16px; }
  .container > section { margin-bottom: 20px; }
  /* ===== Card ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* ===== Buttons ===== */
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
  }
  .btn-outline:active { background: var(--card); }
  .btn-green { background: var(--green); }
  .btn-orange { background: var(--orange); }
  .btn-red { background: var(--red); }
  .btn-sm { padding: 6px 14px; font-size: 13px; min-height: 36px; border-radius: 8px; }
  /* ===== Module 1: Check-in ===== */
  .checkin-area { text-align: center; padding: 10px 0; }
  .today-date { font-size: 15px; color: var(--text-mid); margin-bottom: 2px; }
  .big-clock {
    font-size: 56px; font-weight: 800; text-align: center;
    color: var(--accent-light); font-variant-numeric: tabular-nums;
    letter-spacing: 4px; margin: 6px 0 14px;
    text-shadow: 0 0 30px rgba(139,126,200,0.15);
  }
  .checkin-btn {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    background: var(--accent-glow);
    color: var(--accent-light);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
  }
  .checkin-btn:active { transform: scale(0.9); }
  .checkin-btn.done {
    border-color: var(--green);
    background: rgba(108,191,132,0.15);
    color: var(--green);
  }
  .checkin-count { font-size: 14px; color: var(--text-mid); }
  .checkin-count b { font-size: 24px; color: var(--accent-light); }
  /* ===== Module 2: Timer ===== */
  .timer-display {
    font-size: 48px;
    font-weight: 800;
    text-align: center;
    color: var(--accent-light);
    font-variant-numeric: tabular-nums;
    margin: 10px 0;
    letter-spacing: 3px;
  }
  .timer-display.running { color: var(--green); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
  .timer-btns { display: flex; gap: 10px; justify-content: center; }
  /* ===== Module 3 & 4: Checklist ===== */
  .task-group-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-light);
    margin: 14px 0 6px 2px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .task-group-label:first-child { margin-top: 0; }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    min-height: 44px;
    transition: all .2s;
  }
  .checklist-item:active { transform: scale(0.98); }
  .checklist-item .checkbox {
    width: 24px; height: 24px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .2s;
    font-size: 14px;
  }
  .checklist-item .checkbox.checked {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .checklist-item .item-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.5;
  }
  .checklist-item.done .item-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .checklist-item .item-time {
    font-size: 12px;
    color: var(--accent-light);
    font-weight: 600;
    flex-shrink: 0;
  }
  .checklist-item .item-count {
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.06);
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    min-width: 28px;
    text-align: center;
  }
  .checklist-item.done .item-count {
    color: var(--green);
    background: rgba(74,222,128,0.12);
  }
  /* Math progress bar */
  .math-progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    margin-top: 4px;
    overflow: hidden;
  }
  .math-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #a78bfa, #fbbf24);
    border-radius: 4px;
    transition: width .4s ease;
  }
  .math-progress-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    display: flex;
    justify-content: space-between;
  }
  .sub-item { margin-left: 20px; }
  .section-label {
    font-size: 13px;
    color: var(--text-mid);
    margin: 10px 0 4px;
    font-weight: 600;
  }
  /* ===== Module 5: Review ===== */
  .review-textarea {
    width: 100%;
    min-height: 120px;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
  }
  .review-textarea:focus { outline: none; border-color: var(--accent); }
  /* ===== Module 6: Memo ===== */
  .memo-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .memo-input-row input {
    flex: 1;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    min-height: 44px;
  }
  .memo-input-row input:focus { outline: none; border-color: var(--accent); }
  .memo-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .memo-item .memo-text { flex: 1; font-size: 14px; line-height: 1.5; }
  .memo-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .memo-actions .icon-btn {
    width: 36px; height: 36px;
    border: none;
    border-radius: 8px;
    background: var(--card-solid);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .memo-actions .icon-btn:active { transform: scale(0.9); }
  .memo-actions .del { color: var(--red); }
  /* ===== Module 7: Coding Roadmap ===== */
  .roadmap-overview {
    text-align: center;
    margin-bottom: 16px;
    padding: 14px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .roadmap-overview .ov-label { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .roadmap-overview .ov-value { font-size: 28px; font-weight: 800; color: var(--accent-light); }
  .roadmap-overview .ov-bar {
    width: 100%; height: 10px; background: rgba(255,255,255,0.06);
    border-radius: 5px; margin-top: 8px; overflow: hidden;
  }
  .roadmap-overview .ov-fill {
    height: 100%; background: linear-gradient(90deg, #8b7ec8, #6cbf84);
    border-radius: 5px; transition: width .5s ease;
  }
  .roadmap-phase {
    position: relative;
    margin-bottom: 0;
    padding-left: 36px;
  }
  .roadmap-phase::before {
    content: '';
    position: absolute;
    left: 15px; top: 0; bottom: -16px;
    width: 2px;
    background: var(--border);
  }
  .roadmap-phase:last-child::before { display: none; }
  .roadmap-phase .phase-badge {
    position: absolute;
    left: 0; top: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    box-shadow: 0 0 0 4px var(--bg);
  }
  .roadmap-phase.done .phase-badge { background: var(--green); }
  .roadmap-phase .phase-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
    margin-left: 8px;
  }
  .roadmap-phase .phase-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-light);
    margin-bottom: 2px;
  }
  .roadmap-phase .phase-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .roadmap-topic {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    transition: all .2s;
  }
  .roadmap-topic:active { transform: scale(0.98); }
  .roadmap-topic .topic-check {
    width: 22px; height: 22px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 12px;
    transition: all .2s;
  }
  .roadmap-topic.done .topic-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .roadmap-topic .topic-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.4;
  }
  .roadmap-topic.done .topic-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .roadmap-topic .topic-meta {
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  /* ===== Stats Modal ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-2);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    animation: slideUp .3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; min-width:44px; min-height:44px; }
  .tab-row { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab-row .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-dim);
    border: 1px solid transparent;
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .tab-row .tab.active { background: var(--accent-glow); color: var(--accent-light); border-color: var(--accent); }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .stat-row b { color: var(--accent-light); }
  .stat-chart { margin: 12px 0; }
  .stat-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .stat-bar .bar-bg { flex:1; height: 16px; background: var(--card-solid); border-radius: 8px; overflow: hidden; }
  .stat-bar .bar-fill { height: 100%; background: var(--accent); border-radius: 8px; transition: width .5s; }
  .stat-bar .bar-label { width: 50px; color: var(--text-dim); }
  .stat-bar .bar-value { width: 50px; text-align: right; color: var(--text); }
  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: var(--card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 12px 24px;
    color: var(--text);
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .toast.show { opacity: 1; bottom: 50px; }
  .toast.success { border-color: var(--green); }
  .toast.warn { border-color: var(--orange); }
  /* ===== Confirm Modal ===== */
  .confirm-modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: var(--card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 24px;
    z-index: 1500;
    text-align: center;
    max-width: 300px;
  }
  .modal-overlay:not(.show) .confirm-modal { display: none; }
  .confirm-modal .confirm-text { margin-bottom: 20px; font-size: 15px; }
  .confirm-modal .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  /* ===== Result Modal ===== */
  .result-modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: var(--card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 30px;
    z-index: 1500;
    display: none;
    text-align: center;
    max-width: 280px;
  }
  .result-modal.show { display: block; animation: pop .3s ease; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0.5); } 100% { transform: translate(-50%,-50%) scale(1); } }
  .result-modal .result-emoji { font-size: 48px; margin-bottom: 8px; }
  .result-modal .result-text { font-size: 20px; font-weight: 700; color: var(--accent-light); margin-bottom: 16px; }
  /* ===== Empty state ===== */
  .empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 20px; }
  /* ===== Hidden ===== */
  .hidden { display: none !important; }

  /* Tabs */
  .tabs {
    display: flex; gap: 2px; padding: 6px 8px;
    flex-wrap: nowrap; background: var(--bg-2);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .tab {
    flex: 1; padding: 10px 0; cursor: pointer;
    color: var(--text-dim); font-size: 14px; font-weight: 500;
    border: none; border-radius: 10px; transition: all .25s;
    text-align: center; background: transparent;
  }
  .tab.active { background: var(--accent-glow); color: var(--accent-light); font-weight: 700; }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

</style>
</head>
<body>

<header>
  <div class="main-title">南浊 · 个人工作台</div>
</header>

<div class="container">
<nav class="tabs" id="tabs">
  <div class="tab active" data-tab="home" onclick="switchTab('home')">🏠 首页</div>
  <div class="tab" data-tab="study" onclick="switchTab('study')">📋 学习</div>
  <div class="tab" data-tab="memo" onclick="switchTab('memo')">📝 备忘</div>
  <div class="tab" data-tab="coding" onclick="switchTab('coding')">💻 编程</div>
</nav>
<div class="panel active" id="panel-home">
  <!-- 模块0：格言 -->
  <section>
    <div class="card motto-card">
      <div class="motto-main" id="rule-text">天行健，君子以自强不息</div>
      <div class="motto-sub" id="rule-text-2">大道五十，天衍四九，人遁其一</div>
    </div>
  </section>
  <!-- 模块1：打卡&数据总览 -->
  <section>
    <div class="card">
      <div class="card-title" data-cfg-title="checkin_stats">📋 打卡 & 数据总览</div>
      <div class="checkin-area">
        <div class="today-date" id="today-date"></div>
        <div class="big-clock" id="big-clock">00:00:00</div>
        <button class="checkin-btn" id="checkin-btn" onclick="toggleCheckin()" data-cfg-btn="checkin">今日打卡</button>
        <div class="checkin-count">累计打卡 <b id="checkin-total">0</b> 天</div>
      </div>
    </div>
  </section>
  <!-- 模块2：番茄计时器 -->
  <section>
    <div class="card">
      <div class="card-title" data-cfg-title="timer">⏱ 番茄计时器</div>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="timer-btns">
        <button class="btn btn-green" id="timer-start" onclick="startTimer()" data-cfg-btn="timer_start">▶ 开始学习</button>
        <button class="btn btn-red" id="timer-stop" onclick="stopTimer()" disabled data-cfg-btn="timer_stop">■ 结束计时</button>
      </div>
      <div style="text-align:center;margin-top:8px;font-size:13px;color:var(--text-dim)" id="timer-count">今日 0 段 · 共 0 分钟</div>
    </div>
  </section>
  <!-- 模块3：学习数据统计（直接展示） -->
  <section>
    <div class="card">
      <div class="card-title" data-cfg-title="stats">📊 学习数据统计</div>
      <div class="tab-row" id="stats-tab-row">
        <div class="tab active" onclick="switchStatTab('day')" data-cfg-stattab="day">日统计</div>
        <div class="tab" onclick="switchStatTab('week')" data-cfg-stattab="week">周统计</div>
        <div class="tab" onclick="switchStatTab('month')" data-cfg-stattab="month">月统计</div>
      </div>
      <div id="stats-content"></div>
    </div>
  </section>
  </div>
</div>

<div class="panel" id="panel-study">
  <!-- 模块4：每日学习任务清单 -->
  <section id="tasks-section">
    <div class="card">
      <div class="card-title" data-cfg-title="tasks">📚 每日学习任务</div>

const DB = {
  get(key, def) {

// ====== Toast ======
let toastTimer;
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ====== Confirm ======
let confirmCallback = null;
function showConfirm(msg, callback) {
  document.getElementById('confirm-text').textContent = msg;
  document.getElementById('confirm-overlay').classList.add('show');
  confirmCallback = callback;
}
document.getElementById('confirm-ok-btn').onclick = () => {
  closeConfirm();

// ====== Date helpers ======
function today() { return new Date().toISOString().slice(0,10); }
function getDayOfWeek() { return new Date().getDay(); } // 0=Sun, 1=Mon, ..., 6=Sat
function isMonday() { return getDayOfWeek() === 1; }
function fmtTime(s) {
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtMin(s) { return Math.floor(s/60) + '分钟'; }
function fmtHour(s) { return (s/3600).toFixed(1) + '小时'; }
function fmtDual(s) { const h=(s/3600).toFixed(1),m=Math.floor(s/60); return h+'小时 · '+m+'分钟'; }

// ====== Module 1: Check-in ======
function getCheckins() { return DB.get('checkins', []); }
function toggleCheckin() {
  const t = today();
  let checkins = getCheckins();
  if (checkins.includes(t)) {
    checkins = checkins.filter(d => d !== t);
    toast('已取消打卡', '');
  } else {
    checkins.push(t);
    toast('打卡成功！✅', 'success');
    document.getElementById('checkin-btn').classList.add('done');
    document.getElementById('checkin-btn').textContent = '已打卡';
  }
  DB.set('checkins', checkins);
  updateCheckinUI();
}
function updateCheckinUI() {
  const checkins = getCheckins();
  const isToday = checkins.includes(today());
  const btn = document.getElementById('checkin-btn');
  if (isToday) { btn.classList.add('done'); btn.textContent = '已打卡'; }
  else { btn.classList.remove('done'); btn.textContent = CFG.buttons.checkin || '今日打卡'; }
  document.getElementById('checkin-total').textContent = checkins.length;
}

// ====== Module 2: Timer ======
let timerRunning = false, timerStart = 0, timerInterval = null, todaySegments = [];

function getTodaySegments() {
  const data = DB.get('timer_segments', {});
  return data[today()] || [];
}
function saveTodaySegments(segs) {
  const data = DB.get('timer_segments', {});
  data[today()] = segs;
  DB.set('timer_segments', data);
}
function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerStart = Date.now();
  document.getElementById('timer-start').disabled = true;
  document.getElementById('timer-stop').disabled = false;
  document.getElementById('timer-display').classList.add('running');
  timerInterval = setInterval(updateTimerDisplay, 100);
}
function stopTimer() {
  if (!timerRunning) return;
  timerRunning = false;
  clearInterval(timerInterval);
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  if (elapsed >= 60) {
    const segs = getTodaySegments();
    segs.push({ start: timerStart, end: Date.now(), duration: elapsed });
    saveTodaySegments(segs);
    toast(`本次学习 ${fmtMin(elapsed)}，已保存✅`, 'success');
  } else {
    toast(`本次仅 ${elapsed} 秒，未满1分钟不计入记录`, 'warn');
  }
  document.getElementById('timer-start').disabled = false;
  document.getElementById('timer-stop').disabled = true;
  document.getElementById('timer-display').classList.remove('running');
  document.getElementById('timer-display').textContent = '00:00:00';
  updateTimerCount();
}
function updateTimerDisplay() {
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  document.getElementById('timer-display').textContent = fmtTime(elapsed);
}
function updateTimerCount() {
  const segs = getTodaySegments();
  const totalSec = segs.reduce((s, x) => s + x.duration, 0);
  const fmt = CFG.statLabels.timer_count || '今日 {n} 段 · 共 {m} 分钟';
  document.getElementById('timer-count').textContent = fmt.replace('{n}',segs.length).replace('{m}',fmtDual(totalSec));
}

function loadConfig(){
  try{
    const v=localStorage.getItem('workbench_config');
    if(!v) return JSON.parse(JSON.stringify(defaultConfig));
    const saved=JSON.parse(v);
    // Force-refresh tabs and cardTitles when config version changes
    if(!saved.configVersion || saved.configVersion<defaultConfig.configVersion){
      saved.tabs=defaultConfig.tabs;
      saved.cardTitles=defaultConfig.cardTitles;
      saved.buttons=defaultConfig.buttons;
      saved.configVersion=defaultConfig.configVersion;
      delete saved.restRuleText;
      delete saved.wheelCats;
      localStorage.setItem('workbench_config',JSON.stringify(saved));
    }
    return saved;
  }catch(e){return JSON.parse(JSON.stringify(defaultConfig))}
}

const MATH_TOTAL=CFG.mathTotal;
const VOCAB_TOTAL=CFG.vocabTotal;
const taskGroups=CFG.taskGroups;

function getTasksDone() { return DB.get('tasks_' + today(), []); }
function setTasksDone(done) { DB.set('tasks_' + today(), done); }
function getTaskCounts() { return DB.get('task_counts', {}); }
function setTaskCounts(counts) { DB.set('task_counts', counts); }
function getMathToday() { return DB.get('math_today_' + today(), 0); }
function setMathToday(val) { DB.set('math_today_' + today(), val); }
function getVocabToday() { return DB.get('vocab_today_' + today(), 0); }
function setVocabToday(val) { DB.set('vocab_today_' + today(), val); }
function renderTasks() {
  const done = getTasksDone();
  const counts = getTaskCounts();
  const list = document.getElementById('tasks-list');
  let html = '';
  let idx = 0;
  taskGroups.forEach(g => {
    html += `<div class="task-group-label">${g.icon} ${g.label}</div>`;
    g.items.forEach(t => {
      const isDone = done.includes(idx);
      const count = counts[idx] || 0;
      if (t.isMath) {
        const mathToday = getMathToday();
        const total = count;
        const pct = Math.round(total / MATH_TOTAL * 100);
        html += `
          <div class="checklist-item" style="flex-wrap:wrap;cursor:default">
            <span class="item-text" style="flex:1"><b>${t.cat}</b></span>
            <span class="item-count" style="background:rgba(167,139,250,0.12);color:var(--accent-light)">${total}/${MATH_TOTAL}</span>
            <div style="width:100%">
              <div class="math-progress-bar"><div class="math-progress-fill" style="width:${pct}%"></div></div>
              <div class="math-progress-label"><span>已学 ${total} 考点 · 今日 ${mathToday}</span><span>${pct}%</span></div>
            </div>
            <div style="width:100%;display:flex;gap:6px;margin-top:6px">
              <button class="btn btn-sm btn-green" style="flex:1" onclick="addMath(1)">+1 考点</button>
              <button class="btn btn-sm" style="flex:1;background:var(--blue)" onclick="addMath(2)">+2 考点</button>
              <button class="btn btn-sm btn-orange" style="flex:1" onclick="addMath(3)">+3 考点</button>
            </div>
          </div>`;
      } else if (t.isVocab) {
        const vocabToday = getVocabToday();
        const total = count;
        const pct = Math.round(total / VOCAB_TOTAL * 100);
        html += `
          <div class="checklist-item" style="flex-wrap:wrap;cursor:default">
            <span class="item-text" style="flex:1"><b>${t.cat}</b></span>
            <span class="item-count" style="background:rgba(167,139,250,0.12);color:var(--accent-light)">${total}/${VOCAB_TOTAL}</span>
            <div style="width:100%">
              <div class="math-progress-bar"><div class="math-progress-fill" style="width:${pct}%"></div></div>
              <div class="math-progress-label"><span>已背 ${total} 页 · 今日 ${vocabToday}</span><span>${pct}%</span></div>
            </div>
            <div style="width:100%;display:flex;gap:6px;margin-top:6px">
              <input type="number" id="vocab-input" placeholder="今日页数" min="1" style="flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:14px;text-align:center" onkeydown="if(event.key==='Enter')addVocab()">
              <button class="btn btn-sm btn-green" style="flex:0 0 auto;padding:8px 16px" onclick="addVocab()">记录</button>
            </div>
          </div>`;
      } else {
        html += `
          <div class="checklist-item ${isDone ? 'done' : ''}" onclick="toggleTask(${idx})">
            <div class="checkbox ${isDone ? 'checked' : ''}">${isDone ? '✓' : ''}</div>
            <span class="item-text"><b>${t.cat}</b>${t.desc ? ' — ' + t.desc : ''}</span>
            <span class="item-count">${count}次</span>
            <span class="item-time">${t.time}</span>
          </div>`;
      }
      idx++;
    });
  });
  list.innerHTML = html;
}
function addMath(n) {
  let counts = getTaskCounts();
  counts[1] = (counts[1] || 0) + n;
  setTaskCounts(counts);
  setMathToday(getMathToday() + n);
  toast(`数学 +${n} 考点 ✅`, 'success');
  renderTasks();
}
function addVocab() {
  const input = document.getElementById('vocab-input');
  const n = parseInt(input.value);
  if (!n || n < 1) { toast('请输入有效页数', 'warn'); return; }
  let counts = getTaskCounts();
  counts[0] = (counts[0] || 0) + n;
  setTaskCounts(counts);
  setVocabToday(getVocabToday() + n);
  input.value = '';
  toast(`英二闪背 +${n} 页 ✅`, 'success');
  renderTasks();
}
function toggleTask(i) {
  let done = getTasksDone();
  let counts = getTaskCounts();
  if (done.includes(i)) {
    done = done.filter(x => x !== i);
    counts[i] = Math.max(0, (counts[i] || 0) - 1);
  } else {
    done.push(i);
    counts[i] = (counts[i] || 0) + 1;
    toast('已完成 ✅', 'success');
  }
  setTasksDone(done);
  setTaskCounts(counts);
  renderTasks();
}

function getMemos() { return DB.get('memos', []); }
function setMemos(m) { DB.set('memos', m); }
function addMemo() {
  const input = document.getElementById('memo-input');
  const text = input.value.trim();
  if (!text) return;
  const memos = getMemos();
  memos.unshift({ id: Date.now(), text, created: Date.now() });
  setMemos(memos);
  input.value = '';
  renderMemos();
  toast('备忘已添加 ✅', 'success');
}
function editMemo(id) {
  const memos = getMemos();
  const m = memos.find(x => x.id === id);
  if (!m) return;
  const text = prompt('编辑备忘：', m.text);
  if (text !== null && text.trim()) {
    m.text = text.trim();
    setMemos(memos);
    renderMemos();
    toast('已修改 ✅', 'success');
  }
}
function delMemo(id) {
  showConfirm('确认删除这条备忘？', () => {
    const memos = getMemos().filter(x => x.id !== id);
    setMemos(memos);
    renderMemos();
    toast('已删除', '');
  });
}
function renderMemos() {
  const memos = getMemos();
  const list = document.getElementById('memo-list');
  if (!memos.length) { list.innerHTML = '<div class="empty">暂无备忘</div>'; return; }
  list.innerHTML = memos.map(m => `
    <div class="memo-item">
      <span class="memo-text">${esc(m.text)}</span>
      <div class="memo-actions">
        <button class="icon-btn" onclick="editMemo(${m.id})">✎</button>
        <button class="icon-btn del" onclick="delMemo(${m.id})">🗑</button>
      </div>
    </div>
  `).join('');
}

  ]},
];
function getRoadmapProgress() {
  return DB.get('roadmap_progress', {});
}
function saveRoadmapProgress(data) {
  DB.set('roadmap_progress', data);
}
function toggleRoadmapTopic(topicId) {
  const progress = getRoadmapProgress();
  progress[topicId] = !progress[topicId];
  saveRoadmapProgress(progress);
  renderRoadmap();
}
function renderRoadmap() {
  const container = document.getElementById('roadmap-container');
  if (!container) return;
  const progress = getRoadmapProgress();
  let totalTopics = 0, doneTopics = 0;
  let html = '';
  for (const phase of roadmapData) {
    const phaseDone = phase.topics.every(t => progress[t.id]);
    totalTopics += phase.topics.length;
    const phaseDoneCount = phase.topics.filter(t => progress[t.id]).length;
    doneTopics += phaseDoneCount;
    html += `<div class="roadmap-phase${phaseDone ? ' done' : ''}">`;
    html += `<div class="phase-badge">${phaseDone ? '✓' : phase.phase}</div>`;
    html += `<div class="phase-card">`;
    html += `<div class="phase-title">${esc(phase.title)}</div>`;
    html += `<div class="phase-desc">${esc(phase.desc)}（${phaseDoneCount}/${phase.topics.length}）</div>`;
    for (const topic of phase.topics) {
      const isDone = !!progress[topic.id];
      html += `<div class="roadmap-topic${isDone ? ' done' : ''}" onclick="toggleRoadmapTopic('${topic.id}')">`;
      html += `<div class="topic-check">${isDone ? '✓' : ''}</div>`;
      html += `<div class="topic-text">${esc(topic.text)}</div>`;
      html += `<div class="topic-meta">${esc(topic.meta)}</div>`;
      html += `</div>`;
    }
    html += `</div></div>`;
  }
  container.innerHTML = html;
  const pct = totalTopics > 0 ? Math.round(doneTopics / totalTopics * 100) : 0;
  const pctEl = document.getElementById('roadmap-percent');
  const fillEl = document.getElementById('roadmap-fill');
  if (pctEl) pctEl.textContent = pct + '%';
  if (fillEl) fillEl.style.width = pct + '%';
}

// ====== Stats ======
let statTab = 'day';
let statsWeekOffset = 0; // 0=this week, -1=last week, etc.
function switchStatTab(tab) {
  statTab = tab;
  statsWeekOffset = 0;
  document.querySelectorAll('#stats-tab-row .tab').forEach((t, i) => {
    t.classList.toggle('active', ['day','week','month'][i] === tab);
  });
  renderStats();
}
function shiftStatsWeek(delta) {
  statsWeekOffset += delta;
  if (statsWeekOffset > 0) statsWeekOffset = 0;
  renderStats();
}
function getAllTimerData() {
  return DB.get('timer_segments', {});
}
function getStatsData(period) {
  const data = getAllTimerData();
  const now = new Date();
  let dates = [];
  if (period === 'day') {
    dates = [today()];
  } else if (period === 'week') {
    const day = now.getDay() || 7;
    const baseDate = new Date(now);
    baseDate.setDate(now.getDate() + statsWeekOffset * 7);
    const baseDay = baseDate.getDay() || 7;
    for (let i = 1; i <= 7; i++) {
      const d = new Date(baseDate);
      d.setDate(baseDate.getDate() - baseDay + i);
      dates.push(d.toISOString().slice(0,10));
    }
  } else {
    const y = now.getFullYear(), m = now.getMonth();
    const days = new Date(y, m + 1, 0).getDate();
    for (let i = 1; i <= days; i++) {
      dates.push(`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
    }
  }
  let result = [];
  const overrides = DB.get('manual_time', {}) || {};
  for (const d of dates) {
    const segs = data[d] || [];
    let total = segs.reduce((s, x) => s + x.duration, 0);
    // Apply manual time override if set (convert minutes to seconds)
    if (overrides[d] !== undefined) {
      total = overrides[d] * 60;
    }
    result.push({ date: d, segments: segs, total });
  }
  return result;
}
function renderStats() {
  const stats = getStatsData(statTab);
  const content = document.getElementById('stats-content');
  const totalSec = stats.reduce((s, x) => s + x.total, 0);
  const checkins = getCheckins();
  const L = CFG.statRowLabels || {};
  const minSuffix = L.minute_suffix || '分';
  
  if (statTab === 'day') {
    const todayStats = stats[0];
    const segs = todayStats.segments;
    let html = `<div class="stat-row"><span>${L.daily_total||'当日总时长'}</span><b>${fmtDual(todayStats.total)}</b></div>`;
    html += `<div class="stat-row"><span>${L.seg_count||'学习段数'}</span><b>${segs.length} 段</b></div>`;
    html += `<div class="section-label" style="margin-top:12px">${L.seg_detail||'分段明细'}</div>`;
    if (segs.length) {
      html += segs.map(s => {
        const st = new Date(s.start), en = new Date(s.end);
        return `<div class="stat-row"><span>${st.toTimeString().slice(0,5)}-${en.toTimeString().slice(0,5)}</span><b>${fmtMin(s.duration)}</b></div>`;
      }).join('');
    } else {
      html += `<div class="empty">${L.no_data||'今日暂无记录'}</div>`;
    }
    content.innerHTML = html;
  } else if (statTab === 'week') {
    const activeDays = stats.filter(s => s.total > 0).length;
    const checkinDays = stats.filter(s => checkins.includes(s.date)).length;
    // Week navigation header
    const wDates = stats.map(s => s.date);
    const wStart = wDates[0] ? wDates[0].slice(5).replace('-','/') : '';
    const wEnd = wDates[6] ? wDates[6].slice(5).replace('-','/') : '';
    const weekLabel = statsWeekOffset === 0 ? '本周' : statsWeekOffset === -1 ? '上周' : `前${-statsWeekOffset}周`;
    let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsWeek(-1)" style="min-width:36px">◀</button>`;
    html += `<span style="font-size:14px;font-weight:600;color:var(--accent-light)">${weekLabel} ${wStart} - ${wEnd}</span>`;
    html += `<button class="btn btn-sm btn-outline" onclick="shiftStatsWeek(1)" style="min-width:36px" ${statsWeekOffset>=0?'disabled':''}>▶</button>`;
    html += `</div>`;
    html += `<div class="stat-row"><span>${L.week_total||'本周总时长'}</span><b>${fmtDual(totalSec)}</b></div>`;
    html += `<div class="stat-row"><span>${L.daily_avg||'日均时长'}</span><b>${fmtDual(totalSec / 7)}</b></div>`;
    html += `<div class="stat-row"><span>${L.checkin_days||'打卡天数'}</span><b>${checkinDays} / 7</b></div>`;
    html += `<div class="stat-row"><span>${L.study_days||'学习天数'}</span><b>${activeDays} / 7</b></div>`;
    html += `<div class="stat-chart"><div class="section-label">${L.trend_title||'时长趋势'}</div>`;
    const days = ['一','二','三','四','五','六','日'];
    const maxVal = Math.max(...stats.map(s => s.total), 1);
    html += stats.map((s, i) => {
      const pct = (s.total / maxVal * 100).toFixed(0);
      const h = (s.total/3600).toFixed(1), mins = Math.floor(s.total / 60);
      return `<div class="stat-bar"><span class="bar-label">周${days[i]}</span><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-value">${h}h · ${mins}${minSuffix}</span></div>`;
    }).join('');
    html += '</div>';
    content.innerHTML = html;
  } else {
    const activeDays = stats.filter(s => s.total > 0).length;
    const checkinDays = stats.filter(s => checkins.includes(s.date)).length;
    let html = `<div class="stat-row"><span>${L.month_total||'月度总时长'}</span><b>${fmtDual(totalSec)}</b></div>`;
    html += `<div class="stat-row"><span>${L.checkin_days||'打卡天数'}</span><b>${checkinDays} 天</b></div>`;
    html += `<div class="stat-row"><span>${L.study_days||'学习天数'}</span><b>${activeDays} 天</b></div>`;
    const maxVal = Math.max(...stats.map(s => s.total), 1);
    const weeks = {};
    const weekOrder = [];
    stats.forEach(s => {
      const d = new Date(s.date + 'T00:00:00');
      const dow = d.getDay() || 7;
      const mon = new Date(d);
      mon.setDate(d.getDate() - dow + 1);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      const fmt = dt => (dt.getMonth()+1)+'/'+dt.getDate();
      const key = fmt(mon)+'-'+fmt(sun);
      if (!weeks[key]) { weeks[key] = 0; weekOrder.push(key); }
      weeks[key] += s.total;
    });
    html += `<div class="stat-chart"><div class="section-label">${L.week_trend||'周度趋势'}</div>`;
    for (const key of weekOrder) {
      const val = weeks[key];
      const pct = (val / maxVal * 100).toFixed(0);
      const h = (val/3600).toFixed(1), mins = Math.floor(val / 60);
      html += `<div class="stat-bar"><span class="bar-label">${key}</span><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-value">${h}h · ${mins}${minSuffix}</span></div>`;
    }
    html += '</div>';
    content.innerHTML = html;
  }
}

// ====== Smart Time Detection ======
function checkTimeHint() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const totalMin = h * 60 + m;
  // 12:00-14:00 lunch break
  if (totalMin >= 720 && totalMin < 840) {
    setTimeout(() => toast('该吃午饭啦，休息一下 🍚', 'warn'), 500);
  }
  // 22:00-8:00 night rest
  if (totalMin >= 1320 || totalMin < 480) {
    setTimeout(() => toast(CFG.timeHint||'该休息啦，辛苦一天了 ❤️', 'warn'), 500);
  }
}

// ====== Utils ======
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}


// ====== Tabs ======
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const tab = document.querySelector(`.tab[data-tab="${name}"]`);
  const panel = document.getElementById('panel-' + name);
  if (tab) tab.classList.add('active');
  if (panel) panel.classList.add('active');
  window.scrollTo(0, 0);
}

// ====== Live Clock ======
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const clockEl = document.getElementById('big-clock');
  if (clockEl) clockEl.textContent = h+':'+m+':'+s;
  const dateEl = document.getElementById('today-date');
  if (dateEl) {
    const days = ['日','一','二','三','四','五','六'];
    dateEl.textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 周'+days[now.getDay()];
  }
}
updateClock();
setInterval(updateClock, 1000);

// ====== Init ======
applyConfig();
updateCheckinUI();
updateTimerCount();
renderTasks();
renderStats();
loadReview();
renderMemos();
renderRoadmap();
checkTimeHint();
</script>
